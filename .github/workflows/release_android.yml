name: Release Android App

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/sarvmd_ui

      - name: Resolve Release Version & Tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep '^version:' apps/sarvmd_ui/pubspec.yaml | sed -E 's/version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/' | tr -d '\r')
            TAG_NAME="v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Extract Release Notes from CHANGELOG
        run: |
          sed -n "/## \[${VERSION}\]/,/## \[/p" apps/sarvmd_ui/CHANGELOG.md | sed '1d;$d' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${TAG_NAME} of SarvMD." > RELEASE_NOTES.md
          fi

      - name: Build Android APK
        run: flutter build apk --release
        working-directory: apps/sarvmd_ui

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_artifacts
          cp apps/sarvmd_ui/build/app/outputs/apk/release/sarvmd-v*.apk release_artifacts/
          cd release_artifacts
          sha256sum sarvmd-v*.apk > sha256sums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: SarvMD ${{ env.TAG_NAME }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release_artifacts/sarvmd-v*.apk
            release_artifacts/sha256sums.txt
