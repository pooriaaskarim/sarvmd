name: sarvmd_ui
description: "A new Flutter project."
version: 0.5.1
publish_to: 'none'
resolution: workspace
environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  sarvmd_core:
    path: ../../packages/sarvmd_core
  flutter_svg: ^2.0.10
  flutter_driver:
    sdk: flutter
  shared_preferences: ^2.5.5
  flutter_bloc: ^8.1.6
  logd: ^0.9.1
  file_picker: ^8.1.7

  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
    - family: IranNastaliq
      fonts:
        - asset: assets/fonts/IranNastaliq.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf

  assets:
    - assets/handwriting/
    - CHANGELOG.md
